spring.application.name=college-finder-backend

server.port=${PORT:8080}

# ---- Database (Neon PostgreSQL) ----
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/college_finder_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Connection pool ----
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:change-this-development-only-secret-key-min-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---- AI ----
app.ai.api-key=${AI_API_KEY:}
app.ai.api-url=${AI_API_URL:https://api.anthropic.com/v1/messages}
app.ai.model=${AI_MODEL:claude-sonnet-4-5}

# ---- Admin bootstrap (optional) ----
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ---- File upload (CSV import) ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
